name: Validate Flood STAC Catalog

on:
  push:
    branches:
      - main
      - flood-main
      - 'flood-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pystac pystac-client

    - name: Validate STAC Catalogs
      run: |
        echo "Validating STAC catalogs..."
        python -c "
        import pystac
        import os

        # Validate flood catalog
        if os.path.exists('ibf_catalog/flood/fl_catalog.json'):
            try:
                catalog = pystac.read_file('ibf_catalog/flood/fl_catalog.json')
                print(f'✓ Flood catalog is valid: {catalog.id}')
                print(f'  Title: {catalog.title}')

                # Get children as list to avoid map object issues
                children = list(catalog.get_children())
                print(f'  Collections: {len(children)}')

                for child in children:
                    print(f'    - {child.id}: {child.title}')

            except Exception as e:
                print(f'✗ Flood catalog validation failed: {e}')
                import traceback
                traceback.print_exc()
                exit(1)
        else:
            print('✗ Flood catalog not found')
            exit(1)
        "

    - name: Generate STAC Browser URLs
      if: success()
      run: |
        echo "## STAC Browser Integration URLs" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Flood Impact-Based Forecasting Catalog" >> $GITHUB_STEP_SUMMARY
        echo "Use these URLs with the STAC Browser at: https://radiantearth.github.io/stac-browser/" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Main Catalog:**" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "https://radiantearth.github.io/stac-browser/#/external/https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/refs/heads/${{ github.ref_name }}/ibf_catalog/flood/fl_catalog.json?.language=en" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Direct Raw GitHub URLs:" >> $GITHUB_STEP_SUMMARY
        echo "- Flood Catalog: https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/refs/heads/${{ github.ref_name }}/ibf_catalog/flood/fl_catalog.json" >> $GITHUB_STEP_SUMMARY
        echo "- Collections: https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/refs/heads/${{ github.ref_name }}/ibf_catalog/flood/collections/" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Usage Instructions:" >> $GITHUB_STEP_SUMMARY
        echo "1. Copy the STAC Browser URL above" >> $GITHUB_STEP_SUMMARY
        echo "2. Paste it directly into your browser" >> $GITHUB_STEP_SUMMARY
        echo "3. The catalog will load automatically in the STAC Browser interface" >> $GITHUB_STEP_SUMMARY